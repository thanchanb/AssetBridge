<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0514"/>
      <stop offset="100%" stop-color="#050b18"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#aa3bff"/>
      <stop offset="100%" stop-color="#00c2ff"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00c2ff"/>
      <stop offset="100%" stop-color="#aa3bff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <!-- Grid/Rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#aa3bff" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="10 10"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00c2ff" stroke-width="2" stroke-opacity="0.1" stroke-dasharray="5 5"/>
  <!-- Crescent Moon (Shielding) -->
  <path d="M 230,130 A 110,110 0 1,0 382,282 A 90,90 0 1,1 230,130 Z" fill="url(#moonGrad)" filter="url(#glow)"/>
  <!-- Bridge Arch -->
  <path d="M 120,330 C 120,230 392,230 392,330" fill="none" stroke="url(#primaryGrad)" stroke-width="24" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 160,330 C 160,260 352,260 352,330" fill="none" stroke="#08060d" stroke-width="8" stroke-linecap="round"/>
  <!-- Bridge Deck -->
  <line x1="120" y1="330" x2="392" y2="330" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round"/>
  <!-- Center Shield Node -->
  <polygon points="256,220 296,240 296,290 256,320 216,290 216,240" fill="#08060d" stroke="url(#primaryGrad)" stroke-width="6" stroke-linejoin="round"/>
  <!-- Stars -->
  <circle cx="340" cy="160" r="6" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="160" cy="200" r="4" fill="#00c2ff" filter="url(#glow)"/>
</svg>
