<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0514"/>
      <stop offset="100%" stop-color="#050b18"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#aa3bff"/>
      <stop offset="100%" stop-color="#00c2ff"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00c2ff"/>
      <stop offset="100%" stop-color="#aa3bff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <!-- Lines -->
  <path d="M 0,200 L 1200,200" stroke="#aa3bff" stroke-width="1" stroke-opacity="0.1"/>
  <path d="M 0,100 L 1200,100" stroke="#aa3bff" stroke-width="1" stroke-opacity="0.05"/>
  <path d="M 0,300 L 1200,300" stroke="#aa3bff" stroke-width="1" stroke-opacity="0.05"/>
  <circle cx="950" cy="200" r="180" fill="none" stroke="#00c2ff" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="10 10"/>
  <circle cx="950" cy="200" r="120" fill="none" stroke="#aa3bff" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="5 5"/>
  <!-- Graphic -->
  <g transform="translate(750, 50)">
    <path d="M 180,50 A 80,80 0 1,0 290,160 A 65,65 0 1,1 180,50 Z" fill="url(#moonGrad)" filter="url(#glow)"/>
    <path d="M 100,200 C 100,120 300,120 300,200" fill="none" stroke="url(#primaryGrad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>
    <line x1="100" y1="200" x2="300" y2="200" stroke="url(#primaryGrad)" stroke-width="8" stroke-linecap="round"/>
    <polygon points="200,120 230,135 230,170 200,190 170,170 170,135" fill="#08060d" stroke="url(#primaryGrad)" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- Text -->
  <g transform="translate(100, 150)">
    <text x="0" y="40" font-family="'Outfit', 'Inter', sans-serif" font-size="72" font-weight="bold" fill="url(#primaryGrad)" letter-spacing="1.5">AssetBridge</text>
    <text x="5" y="85" font-family="'Inter', sans-serif" font-size="22" font-weight="500" fill="#a0aec0" letter-spacing="6">SHIELDED CROSS-CHAIN TRANSFERS</text>
    <text x="5" y="115" font-family="'Inter', sans-serif" font-size="14" font-weight="normal" fill="#718096" letter-spacing="2">POWERED BY MIDNIGHT ZERO-KNOWLEDGE PROOFS</text>
  </g>
</svg>
